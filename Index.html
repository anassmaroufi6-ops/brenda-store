<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brenda Store</title>
  <style>
    body{font-family:Arial;margin:0;background:#f5f5f5}
    header{background:#fff;padding:15px;display:flex;justify-content:space-between;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    .logo{font-size:26px;font-weight:bold}
    .hero{text-align:center;padding:50px;background:#fff}
    .products{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:15px}
    .card{background:#fff;border-radius:20px;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    .card img{width:100%;border-radius:15px}
    button{background:black;color:white;border:none;padding:10px;border-radius:12px;width:100%}
    .whatsapp{display:block;text-align:center;background:green;color:#fff;padding:15px;margin:20px;border-radius:15px;text-decoration:none}
  </style>
</head>
<body>

<header>
  <div class="logo">Brenda Store</div>
  <div>🛒</div>
</header>

<section class="hero">
  <h1>Welcome to Brenda Store</h1>
  <p>ملابس عصرية بأثمنة زوينة</p>
</section>

<section class="products">
  <div class="card">
    <img src="https://via.placeholder.com/300" />
    <h3>T-shirt</h3>
    <p>149 DH</p>
    <button>Ajouter au panier</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" />
    <h3>Hoodie</h3>
    <p>299 DH</p>
    <button>Ajouter au panier</button>
  </div>
</section>

<a class="whatsapp" href="https://wa.me/212600000000">
  طلب عبر واتساب
</a>

</body>
</html>
